name: scholarship-tracker-restart
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_tracker_only}
      POSTGRES_DB: ${POSTGRES_DB:-scholarship_tracker_restart}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
